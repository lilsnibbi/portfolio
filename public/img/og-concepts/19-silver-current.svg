		<g stroke="#6D6D6D">
			<ellipse cx="76" cy="160" rx="100" ry="64"/><ellipse cx="76" cy="160" rx="144" ry="94"/>
			<ellipse cx="76" cy="160" rx="188" ry="124"/><ellipse cx="76" cy="160" rx="232" ry="154"/>
			<ellipse cx="76" cy="160" rx="276" ry="184"/><ellipse cx="76" cy="160" rx="320" ry="214" stroke-dasharray="2 7"/>
			<ellipse cx="1124" cy="160" rx="100" ry="64"/><ellipse cx="1124" cy="160" rx="144" ry="94"/>
			<ellipse cx="1124" cy="160" rx="188" ry="124"/><ellipse cx="1124" cy="160" rx="232" ry="154"/>
			<ellipse cx="1124" cy="160" rx="276" ry="184"/><ellipse cx="1124" cy="160" rx="320" ry="214" stroke-dasharray="2 7"/>
		</g>
		<g stroke="#D7D7D7">
			<path d="M76 66c80 0 144 42 144 94M980 160c0 52 64 94 144 94" stroke-width="5" opacity=".35" filter="url(#glow)"/>
