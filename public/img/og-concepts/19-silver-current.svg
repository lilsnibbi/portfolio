<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
	<title>Snibbi — Silver current</title>
	<desc>A faint silver glow traces selected orbital arcs on a deep charcoal background.</desc>
	<defs>
		<radialGradient id="light" r=".76"><stop stop-color="#222222"/><stop offset="1" stop-color="#090909"/></radialGradient>
		<linearGradient id="silver" x1="470" y1="98" x2="728" y2="182" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E1E1E1"/><stop offset="1" stop-color="#A6A6A6"/></linearGradient>
		<linearGradient id="fade"><stop stop-color="#FFFFFF" stop-opacity=".7"/><stop offset=".36" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".64" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".7"/></linearGradient>
		<mask id="edges"><path fill="url(#fade)" d="M0 0h1200v320H0z"/></mask>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
	</defs>
	<path fill="url(#light)" d="M0 0h1200v320H0z"/>
