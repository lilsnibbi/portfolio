		<text x="600" y="59" fill="#929292" font-size="10" letter-spacing="4">SMALL DETAILS. REAL PURPOSE.</text>
		<text x="596" y="174" fill="url(#silver)" font-size="98" font-weight="600" letter-spacing="-5">Snibbi</text>
		<text x="600" y="215" fill="#B6B6B6" font-size="19">Making life easier, one line of code at a time</text>
		<path d="M582 244h36" stroke="#696969"/>
		<text x="600" y="277" fill="#969696" font-size="12" letter-spacing="1.5">lilsnibbi.dev</text>
