<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
	<title>Snibbi — Interference</title>
	<desc>Two overlapping wave sources at each edge create a fine interference pattern around the centered identity.</desc>
	<defs>
		<radialGradient id="light" r=".75"><stop stop-color="#252525"/><stop offset="1" stop-color="#0C0C0C"/></radialGradient>
		<linearGradient id="fade"><stop stop-color="#FFFFFF" stop-opacity=".6"/><stop offset=".34" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".66" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".6"/></linearGradient>
		<mask id="edges"><path fill="url(#fade)" d="M0 0h1200v320H0z"/></mask>
		<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#FFFFFF" opacity=".04"/></pattern>
	</defs>
	<path fill="url(#light)" d="M0 0h1200v320H0z"/>
	<path fill="url(#dots)" d="M0 0h1200v320H0z"/>
	<g mask="url(#edges)" stroke="#747474" stroke-width=".9">
		<g transform="translate(5 160)">
			<ellipse rx="104" ry="68"/><ellipse rx="149" ry="101"/><ellipse rx="194" ry="134"/><ellipse rx="239" ry="167"/><ellipse rx="284" ry="200"/>
		</g>
		<g transform="translate(130 160)" opacity=".65">
			<ellipse rx="104" ry="68"/><ellipse rx="149" ry="101"/><ellipse rx="194" ry="134"/><ellipse rx="239" ry="167"/><ellipse rx="284" ry="200"/>
		</g>
		<g transform="translate(1195 160)">
			<ellipse rx="104" ry="68"/><ellipse rx="149" ry="101"/><ellipse rx="194" ry="134"/><ellipse rx="239" ry="167"/><ellipse rx="284" ry="200"/>
		</g>
		<g transform="translate(1070 160)" opacity=".65">
			<ellipse rx="104" ry="68"/><ellipse rx="149" ry="101"/><ellipse rx="194" ry="134"/><ellipse rx="239" ry="167"/><ellipse rx="284" ry="200"/>
		</g>
	</g>
	<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
		<text x="600" y="58" fill="#939393" font-size="10" letter-spacing="3.5">SYSTEMS / TOOLS / COMMUNITIES</text>
		<text x="596" y="175" fill="#F0F0F0" font-size="100" font-weight="600" letter-spacing="-5">Snibbi</text>
		<text x="600" y="215" fill="#B0B0B0" font-size="19">Making life easier, one line of code at a time</text>
		<path d="M582 244h36" stroke="#606060"/>
		<text x="600" y="277" fill="#929292" font-size="12" letter-spacing="1.5">lilsnibbi.dev</text>
	</g>
	<path d="M.5.5h1199v319H.5z" stroke="#FFFFFF" stroke-opacity=".06"/>
</svg>
