		<linearGradient id="disc" x1="147" y1="102" x2="263" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#303030"/><stop offset="1" stop-color="#131313"/></linearGradient>
		<linearGradient id="silver" x1="175" y1="128" x2="231" y2="193" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#939393"/></linearGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" stroke="#FFFFFF" stroke-opacity=".022"/></pattern>
		<filter id="shadow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-opacity=".45"/></filter>
	</defs>
	<path fill="url(#light)" d="M0 0h1200v320H0z"/>
	<path fill="url(#grid)" d="M0 0h1200v320H0z"/>
	<g transform="translate(202 160)">
