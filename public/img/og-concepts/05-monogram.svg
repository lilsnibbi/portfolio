		<circle r="91" stroke="#4D4D4D"/>
		<circle cy="-91" r="3.5" fill="#C4C4C4"/>
		<circle cy="91" r="3" fill="#707070"/>
	</g>
	<circle cx="202" cy="160" r="63" fill="url(#disc)" stroke="#5A5A5A" filter="url(#shadow)"/>
	<path d="M228 132h-39a14 14 0 0 0 0 28h26a14 14 0 0 1 0 28h-39" stroke="url(#silver)" stroke-width="10" stroke-linecap="square"/>
	<path d="M324 160h32" stroke="#666666" stroke-dasharray="2 5"/>
