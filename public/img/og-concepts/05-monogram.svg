		<text x="392" y="65" fill="#8D8D8D" font-size="11" letter-spacing="3">THOUGHTFULLY ENGINEERED</text>
		<text x="387" y="161" fill="#F1F1F1" font-size="84" font-weight="600" letter-spacing="-5">Snibbi</text>
