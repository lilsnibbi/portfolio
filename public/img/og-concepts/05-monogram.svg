<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
	<title>Snibbi — Monogram</title>
	<desc>A sculpted S monogram inside concentric rings, balanced with a clean name and specialty labels.</desc>
	<defs>
