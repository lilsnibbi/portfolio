<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
	<title>Snibbi — Quiet signal</title>
	<desc>A centered wordmark framed by symmetrical orbital contours fading into a charcoal background.</desc>
