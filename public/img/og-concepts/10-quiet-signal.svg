		<mask id="edges"><path fill="url(#fade)" d="M0 0h1200v320H0z"/></mask>
		<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#FFFFFF" opacity=".05"/></pattern>
	</defs>
