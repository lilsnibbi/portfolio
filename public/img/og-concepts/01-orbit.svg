<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
	<title>Snibbi — Orbit</title>
	<desc>A slim charcoal banner with an oversized name, a fine dot grid, and an orbital code emblem.</desc>
	<defs>
		<radialGradient id="light" cx=".78" cy=".46" r=".73"><stop stop-color="#282828"/><stop offset="1" stop-color="#0D0D0D"/></radialGradient>
		<linearGradient id="metal" x1="859" y1="88" x2="989" y2="227" gradientUnits="userSpaceOnUse"><stop stop-color="#303030"/><stop offset="1" stop-color="#131313"/></linearGradient>
		<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity=".055"/></pattern>
		<filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-opacity=".45"/></filter>
	</defs>
	<path fill="url(#light)" d="M0 0h1200v320H0z"/>
	<path fill="url(#dots)" d="M0 0h1200v320H0z"/>
	<g transform="translate(925 160)">
		<circle r="182" stroke="#FFFFFF" stroke-opacity=".035"/>
		<circle r="140" stroke="#3B3B3B" stroke-dasharray="2 8"/>
		<circle r="108" stroke="#424242"/>
		<path d="M-108 0a108 108 0 0 1 108-108" stroke="#8B8B8B"/>
		<circle cx="-108" r="4" fill="#D4D4D4"/>
		<circle cx="99" cy="99" r="4" fill="#696969"/>
	</g>
	<circle cx="925" cy="160" r="76" fill="url(#metal)" stroke="#505050" filter="url(#shadow)"/>
	<g stroke="#E8E8E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
		<path d="m900 144-17 16 17 16m50-32 17 16-17 16m-18-44-14 56"/>
	</g>
	<path d="M689 160h79" stroke="#4B4B4B" stroke-dasharray="3 6"/>
	<circle cx="689" cy="160" r="3" fill="#858585"/>
	<g font-family="Arial, Helvetica, sans-serif">
		<text x="64" y="52" fill="#929292" font-size="11" letter-spacing="3">INDEPENDENT DEVELOPER / AUSTRALIA</text>
		<text x="60" y="174" fill="#F3F3F3" font-size="88" font-weight="600" letter-spacing="-5">Snibbi</text>
		<text x="65" y="212" fill="#A6A6A6" font-size="20">Making life easier, one line of code at a time</text>
		<text x="65" y="276" fill="#868686" font-size="12" letter-spacing="1">lilsnibbi.dev</text>
		<text x="1136" y="276" text-anchor="end" fill="#727272" font-size="10" letter-spacing="2">ALWAYS BUILDING</text>
	</g>
	<path d="M.5.5h1199v319H.5z" stroke="#FFFFFF" stroke-opacity=".06"/>
</svg>
