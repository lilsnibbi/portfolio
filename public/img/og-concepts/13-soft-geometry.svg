<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
	<title>Snibbi — Soft geometry</title>
	<desc>Nested, softly squared contours frame the same centered wordmark and motto.</desc>
