		<mask id="edges"><path fill="url(#fade)" d="M0 0h1200v320H0z"/></mask>
		<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" stroke="#FFFFFF" stroke-opacity=".02"/></pattern>
	</defs>
	<path fill="url(#light)" d="M0 0h1200v320H0z"/>
	<path fill="url(#grid)" d="M0 0h1200v320H0z"/>
