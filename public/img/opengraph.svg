		<mask id="edges"><path fill="url(#fade)" d="M0 0h1200v320H0z"/></mask>
		<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#FFFFFF" opacity=".045"/></pattern>
		<linearGradient id="silver" x1="480" y1="90" x2="720" y2="181" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#BBBBBB"/></linearGradient>
