<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
	<title>Snibbi — Software developer</title>
	<desc>Making life easier, one line of code at a time. A centered wordmark surrounded by broad, concentric ellipses.</desc>
